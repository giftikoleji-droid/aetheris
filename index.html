  <style>
:root{
  --bg:#060b16; --bg2:#0b1222; --cyan:#00e5f5; --white:#f7fafc;
  --muted:#8c9ab0; --border:rgba(255,255,255,.09);
  --green:#4ade80; --red:#fb7185; --amber:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
html{scroll-behavior:smooth;}
body{min-height:100vh;color:var(--white);background:linear-gradient(180deg,var(--bg2),var(--bg));overflow-x:hidden;}
button,input,select,textarea{font:inherit;}
button{cursor:pointer;border:0;background:none;color:inherit;}
button:disabled{opacity:.55;cursor:not-allowed;}
#globeCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.22;}
.page-wrap{position:relative;z-index:1;}
.navbar{position:fixed;top:0;left:0;right:0;height:72px;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(6,11,22,.88);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--white);}
.brand-mark{color:var(--cyan);font-size:1.35rem;line-height:1;text-shadow:0 0 18px rgba(0,229,245,.35);}
.brand-text{display:flex;flex-direction:column;line-height:1.05;}
.brand-name{font-size:.95rem;font-weight:800;letter-spacing:1.6px;}
.brand-sub{font-size:.62rem;font-weight:650;letter-spacing:2.4px;color:var(--muted);}
.nav-links{display:flex;align-items:center;gap:18px;}
.nav-text-btn{padding:8px 2px;font-size:.82rem;font-weight:600;color:var(--muted);}
.nav-text-btn:hover{color:var(--cyan);}
.primary-btn{padding:12px 20px;border-radius:9px;background:var(--cyan);color:#041017;font-weight:750;box-shadow:0 8px 28px rgba(0,229,245,.22);transition:.18s;}
.primary-btn:hover{background:#20edf9;transform:translateY(-1px);}
.ghost-btn{padding:12px 20px;border-radius:9px;border:1px solid var(--border);color:var(--white);font-weight:650;}
.ghost-btn:hover{border-color:rgba(0,229,245,.4);color:var(--cyan);}
